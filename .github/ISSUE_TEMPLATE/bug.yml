name: Bug
description: Something on the canvas or in the extension is wrong.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        The product source is private; this repo is the public tracker.
        Do not paste customer Terraform or Bicep. A public sample or a
        stripped-down snippet is enough.

        Licensing, seats, and billing: support@solidcloud.io
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: Opened vpc_sample on a canvas. Expected a VPC and a subnet. Got "invalid string quoting" and an empty graph.
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Terraform
        - Bicep
        - Both
        - Neither (extension UI, licence, MCP, other)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SchematIaC version
      description: Marketplace version, or SchematIaC — Licence Status.
      placeholder: 0.14.0
    validations:
      required: true
  - type: input
    id: vscode
    attributes:
      label: VS Code / Cursor and OS
      placeholder: VS Code 1.93 on Windows 11
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Public sample or stripped snippet
      description: A link to a public repo, or a short invented snippet. Never real customer infrastructure.
      render: hcl
  - type: checkboxes
    id: no-customer-code
    attributes:
      label: Before you submit
      options:
        - label: This report does not include customer Terraform or Bicep.
          required: true
